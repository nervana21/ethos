[package]
name = "ethos-schema-oracle"
version = "0.1.0"
edition = "2021"
description = "Live schema-oracle smoke: IR-guided RPC calls against regtest bitcoind"
license = "CC0-1.0"
publish = false

[lib]
name = "ethos_schema_oracle"
path = "src/lib.rs"

[[bin]]
name = "schema-oracle"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ethos-analysis = { path = "../analysis" }
ethos-bitcoind = { path = "../../../ethos-bitcoind", default-features = true }
ir = { package = "ethos-ir", path = "../../primitives/ir" }
path = { package = "ethos-path", path = "../../primitives/path" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
