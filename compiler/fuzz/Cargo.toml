[package]
name = "ethos-fuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
ctor = "0.6.0"
# Local ethos dependencies
ethos-adapters = { path = "../../adapters" }
ethos-analysis = { path = "../analysis" }
fuzz-types = { package = "ethos-fuzz-types", path = "../../primitives/fuzz" }
ir = { package = "ethos-ir", path = "../../primitives/ir" }
rand = "0.9.2"
rand_chacha = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
thiserror = "2.0.17"
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros"] }
types = { package = "ethos-types", path = "../../primitives/types" }

# Fuzz target bins restored when fuzz_targets/*.rs are re-added.
