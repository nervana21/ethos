[package]
name = "ethos-codegen-golden-decode"
version = "0.1.0"
edition = "2021"
publish = false
license = "CC0-1.0"
description = "Builds generated Bitcoin Core Raw response types and runs serde decode golden tests."

[features]
default = []
# Declared so `#[cfg_attr(feature = "serde-deny-unknown-fields", ...)]` in generated code is check-cfg clean.
serde-deny-unknown-fields = []

[lib]
path = "src/lib.rs"

[dependencies]
bitcoin = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"

[build-dependencies]
ethos-codegen = { package = "ethos-codegen", path = "../codegen" }
ethos-ir = { package = "ethos-ir", path = "../../primitives/ir" }
ethos-types = { package = "ethos-types", path = "../../primitives/types" }

[dev-dependencies]
# Tests read `raw_response_policy::RPC_DECODE_GOLDEN_FIXTURES` (inventory for `decode_golden.rs`).
ethos-codegen = { package = "ethos-codegen", path = "../codegen" }
ethos-ir = { package = "ethos-ir", path = "../../primitives/ir" }
ethos-types = { package = "ethos-types", path = "../../primitives/types" }
